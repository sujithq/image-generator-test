name: Generate Image with Azure OpenAI

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Image generation prompt"
        required: true
        type: string
      size:
        description: "Image size (e.g. 1024x1024, 1792x1024, 1024x1792)"
        required: false
        default: "1024x1024"
        type: string
      quality:
        description: "Image quality"
        required: false
        default: "standard"
        type: choice
        options:
          - standard
          - hd
      style:
        description: "Image style"
        required: false
        default: "vivid"
        type: choice
        options:
          - vivid
          - natural
      output_filename:
        description: "Output filename (e.g. output.png)"
        required: false
        default: "image.png"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  generate-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate image
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_IMAGE_DEPLOYMENT: ${{ vars.AZURE_OPENAI_IMAGE_DEPLOYMENT || secrets.AZURE_OPENAI_IMAGE_DEPLOYMENT }}
          # Optional API-key fallback – only set when key auth is required.
          # Leave this secret unset (or empty) to use OIDC / DefaultAzureCredential.
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          python scripts/generate-image.py \
            --prompt "${{ inputs.prompt }}" \
            --size "${{ inputs.size }}" \
            --quality "${{ inputs.quality }}" \
            --style "${{ inputs.style }}" \
            --output "output/${{ inputs.output_filename }}"

      - name: Upload image and metadata artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-image
          # Uploads the image file and its JSON metadata sidecar.
          path: output/
          if-no-files-found: error
          retention-days: 7
